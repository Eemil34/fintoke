[variables]
CI = "1"
SKIP_ENV_SETUP = "1"
ELECTRON_SKIP_BINARY_DOWNLOAD = "1"
NPM_CONFIG_AUDIT = "false"
NPM_CONFIG_FUND = "false"
NEXT_TELEMETRY_DISABLED = "1"
DATABASE_URL = "file:./data/cc.db"

[phases.setup]
nixPkgs = ["nodejs_20", "openssl"]

[phases.install]
cmds = ["npm ci --ignore-scripts"]

[phases.build]
cmds = ["mkdir -p data", "npx prisma generate", "npx next build"]

[start]
cmd = "node scripts/start-prod.js"
